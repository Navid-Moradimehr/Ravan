{{- $fullname := include "data-stream.fullname" . -}}
{{- $name := include "data-stream.name" . -}}

{{- if .Values.apiService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  namespace: {{ include "data-stream.namespace" . }}
  labels:
    app: {{ $name }}
    component: api-service
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.apiService.port }}
      targetPort: http
      name: http
  selector:
    app: {{ $name }}
    component: api-service
{{- end }}

{{- range $component, $config := (dict
      "normalized-fanout" .Values.normalizedFanout
      "processed-fanout" .Values.processedFanout
      "ai-fanout" .Values.aiFanout
      "operational-fanout" .Values.operationalFanout
      "artifact-fanout" .Values.artifactFanout
      "raw-archive" .Values.rawArchive
      "dataset-worker" .Values.datasetWorker) }}
{{- if $config.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-{{ $component }}
  namespace: {{ include "data-stream.namespace" $ }}
  labels:
    app: {{ $name }}
    component: {{ $component }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $config.metricsPort }}
      targetPort: metrics
      name: metrics
  selector:
    app: {{ $name }}
    component: {{ $component }}
{{- end }}
{{- end }}

---
{{- if .Values.aiGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-ai-gateway
  namespace: {{ include "data-stream.namespace" . }}
  labels:
    app: {{ $name }}
    component: ai-gateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.aiGateway.port }}
      targetPort: http
      name: http
  selector:
    app: {{ $name }}
    component: ai-gateway
{{- end }}

---
{{- if .Values.edgeIngest.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-edge-ingest
  namespace: {{ include "data-stream.namespace" . }}
  labels:
    app: {{ $name }}
    component: edge-ingest
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.edgeIngest.port }}
      targetPort: metrics
      name: metrics
  selector:
    app: {{ $name }}
    component: edge-ingest
{{- end }}
